[project]
name = "godata"
version = "0.1.0"
description = "Data access layer — Peewee + PostgreSQL for Jibli DZ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "peewee>=3.17",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godata"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
    "pyright>=1.1",
]
